version: '3.8'

services:
  opencode-zen-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-zen-gateway
    ports:
      - "8000:8000"
    environment:
      # Server configuration
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      
      # Required API Keys
      - PROXY_API_KEY=${PROXY_API_KEY:-my-super-secret-password-123}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      
      # Optional settings
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG_MODE=${DEBUG_MODE:-off}
    
    # Alternative: Load all variables from .env file
    env_file:
      - .env
    
    volumes:
      # Mount debug logs directory (optional, for debugging)
      - ./debug_logs:/app/debug_logs
    
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    deploy:
      resources:
        limits:
          cpus: '2'        # Maximum CPU cores
          memory: 1G       # Maximum memory
        reservations:
          cpus: '0.5'      # Minimum guaranteed CPU
          memory: 256M     # Minimum guaranteed memory

networks:
  default:
    name: opencode-zen-gateway-network
